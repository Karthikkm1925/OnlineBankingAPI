spring:
  application:
    name: online-banking-api
  datasource:
    url: jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 5570	

jwt:
  secret: bank-secret-key-should-be-256-bit-minimum
  expiration: 3600000  

logging:
  level:
    org.springframework.security: DEBUG